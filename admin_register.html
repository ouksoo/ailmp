<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<title></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.css" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
	<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
	<link rel="stylesheet" href="css/style.css" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/simplebar@latest/dist/simplebar.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
	<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body>

<!-- 공통 -->
<div class="film-common"></div>
<!-- //공통 -->

<div class="container-wrapper admin-container">

	<div class="common-wrapper">
		<div class="sign-up-wrapper password-modify">
			<p class="member-step1-tit">관리자 계정 생성</p><br />

			<!-- 계정 사용이 중지 되었습니다. -->
			<div class="account-register-wrapper error-container">
				<p class="txt-1">계정 생성이 요청 되었습니다.<br />최고 관리자 승인 후 로그인 할 수 있습니다.</p>
			</div>
			<!-- //계정 사용이 중지 되었습니다. -->

			<div class="register-input-forms" style="display: none;">
				<p class="login-title">이메일(아이디)</p>
				<div class="pos-r">
					<input type="text" class="modal-button w-100-per login-inputs" placeholder="이메일을 입력해주세요." />
				</div>
				<p class="login-title pw">비밀번호</p>
				<div class="pos-r">
					<input type="password" class="modal-button w-100-per login-inputs" placeholder="8글자 이상 입력해주세요." />
				</div>
				<p class="login-title pw">비밀번호 확인</p>
				<div class="pos-r">
					<input type="password" class="modal-button w-100-per login-inputs" placeholder="비밀번호를 한번더 입력해주세요." />
				</div>
				<p class="login-title pw">이름</p>
				<div class="pos-r">
					<input type="text" class="modal-button w-100-per login-inputs" placeholder="이름을 입력해주세요." />
				</div>
				<p class="login-title pw">핸드폰</p>
				<div class="pos-r pww">
					<input type="text" class="modal-button w-100-per login-inputs" placeholder="‘-’없이 숫자만 입력해 주세요." />
				</div>
				<div class="pos-r auth-button">
					<button class="modal-button w-100-per bd0 green login-button">계정 요청하기</button>
					<a href="#">로그인으로 돌아가기</a>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- Modal : 공통 alert -->
<div class="modal fade" id="commonAlertSingleModal" tabindex="-1" role="dialog" aria-labelledby="commonAlertSingleModal" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered w-480" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<a href="#" class="modal-close-button" data-bs-dismiss="modal">닫기</a>
			</div>
			<div class="modal-body">
				<p class="only-text-center">
					<span class="alert-txt-1">이메일(아이디)을 입력해주세요.</span>
					<span class="alert-txt-2" style="display: none;">올바른 이메일 형식을 입력해 주세요.</span>
					<span class="alert-txt-3" style="display: none;">동일한 이메일이 이미 사용 중입니다.</span>
					<span class="alert-txt-4" style="display: none;">비밀번호를 입력해주세요.</span>
					<span class="alert-txt-5" style="display: none;">비밀번호는 8글자 이상 입력해주세요.</span>
					<span class="alert-txt-6" style="display: none;">이름을 입력해주세요.</span>
					<span class="alert-txt-7" style="display: none;">비밀번호와 비밀번호 확인이 일치하지 않습니다.</span>
					<span class="alert-txt-8" style="display: none;">핸드폰 번호를 입력해주세요.</span>
					<span class="alert-txt-9" style="display: none;">올바른 핸드폰 번호를 입력해 주세요.</span>
				</p>
			</div>
			<div class="modal-footer">
				<a href="#" class="dp-b modal-button green" data-bs-dismiss="modal">확인</a>
			</div>
		</div>
	</div>
</div>
<!-- //Modal : 공통 alert -->


<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/lenis.min.js"></script>
<script src="js/admin.js"></script>
<script>
  
</script>
</body>
</html>
