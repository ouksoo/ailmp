<!-- 공통 -->
<div class="film-common"></div>

<div class="container-wrapper admin-container">

			<p class="member-step1-tit">ITPLACEY<br />ADMIN</p><br />

			<div class="pos-r">
				<input type="text" class="modal-button w-100-per login-inputs" />
			</div>
			<p class="login-title pw">비밀번호</p>
			<div class="pos-r pww">
				<input type="password" class="modal-button w-100-per login-inputs" placeholder="8글자 이상 영문, 숫자, 특수문자를 입력해 주세요." />
			</div>
			<div class="pos-r auth-button">
				<button class="modal-button w-100-per bd0 green login-button">로그인</button>
				<a href="#">관리자 계정 생성</a>
			</div>
		</div>
	</div>
</div>

<!-- Modal : 계정을 확인 할 수 없습니다. -->
<div class="modal fade" id="accountCannotConfirmModal" tabindex="-1" role="dialog" aria-labelledby="accountCannotConfirmModal" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered w-480" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<a href="#" class="modal-close-button" data-bs-dismiss="modal">닫기</a>
			</div>
			<div class="modal-body">
				<p class="only-text-center">계정을 확인 할 수 없습니다.</p>
			</div>
			<div class="modal-footer">
				<a href="#" class="dp-b modal-button green" data-bs-dismiss="modal">확인</a>
			</div>
		</div>
	</div>
</div>

			<div class="modal-header">
